<!DOCTYPE html>
<html lang="en">
<head>

<body>

      <div class="brand-line">
        <div class="t1">PMS Trading</div>
        <div class="t2">Inventory &amp; Delivery Monitoring</div>
      </div>

      <div class="auth-error" id="authErr" role="alert"></div>

      <form id="loginForm" autocomplete="off" aria-label="User login">
        <div class="field">
          <label class="fl" for="username">Username <span class="req">*</span></label>
          <input id="username" name="username" type="text" required autofocus>
        </div>
        <div class="field">
          <label class="fl" for="password">Password <span class="req">*</span></label>
          <div style="position:relative">
            <input id="password" name="password" type="password" required>
            <button type="button" id="togglePw"
                    aria-label="Show password" aria-pressed="false"
                    title="Show password"
                    style="position:absolute;right:4px;top:50%;transform:translateY(-50%);
                           border:0;background:none;cursor:pointer;padding:6px 8px;font-size:14px;
                           color:var(--faint);border-radius:6px;user-select:none">
              Ã¢â€”Â
            </button>
          </div>
        </div>
        <button class="btn primary" type="submit" id="loginBtn" style="width:100%;justify-content:center;margin-top:6px">
          Sign in
        </button>
      </form>
      <p class="hint" style="text-align:center;margin-top:16px">
        Single-owner system Ã‚Â· PMS School &amp; Office Supplies
      </p>
    </div>
  </div>
